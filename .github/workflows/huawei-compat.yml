name: Huawei decoder compatibility APK
on:
  push:
    branches: ['fix/huawei-decoder-0149-20261101']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huawei-decoder-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HONGGUOTV_TEST_RUNNER: com.hongguotv.nativeapp.DecoderAcceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Apply exact-baseline source patch
        run: |
          python3 -m py_compile kotlin-tv/compat/apply_huawei_fix.py
          python3 kotlin-tv/compat/apply_huawei_fix.py
          mkdir -p deliverables
          git diff --check
          git diff > deliverables/huawei-compat.patch
      - name: Prepare SDK and deterministic test video
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p kotlin-tv/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc=size=640x360:rate=24' -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 8 -c:v libx264 -pix_fmt yuv420p -profile:v baseline -level:v 3.0 -c:a aac -b:a 64k -movflags +faststart -y kotlin-tv/app/src/androidTest/assets/codec-sample.mp4
      - name: Unit tests, lint, APK and instrumentation build
        run: |
          chmod +x kotlin-tv/gradlew
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --max-workers=2
      - name: Package APK and corresponding modified source
        run: |
          cp kotlin-tv/app/build/outputs/apk/debug/app-debug.apk deliverables/hongguotv-0.14.9-huawei-compat.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs deliverables/*.apk > deliverables/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging deliverables/*.apk > deliverables/apk-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, subprocess, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('kotlin-tv/core/build/test-results/test').glob('TEST-*.xml')]
          stats={key:sum(int(s.attrib.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          evidence={'base':'02118aa8f0e3ff5b7b2f17ae09df7b0c272b1960','build_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'unit_tests':stats,'huawei_physical_device_tested':False,'live_provider_playback_tested':False,'package':'com.hongguotv.nativeapp.huawei','signing':'Independent CI debug key; side-by-side install; not an in-place update.'}
          Path('deliverables/build-evidence.json').write_text(json.dumps(evidence,indent=2))
          with zipfile.ZipFile('deliverables/hongguotv-huawei-compat-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('kotlin-tv').rglob('*'):
                  if p.is_file() and not any(x in ('build','.gradle','__pycache__') for x in p.parts) and p.name not in ('local.properties','keystore.properties'):
                      z.write(p)
              z.write('LICENSE'); z.write('.github/workflows/huawei-compat.yml')
          PY
          cd deliverables
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Start emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-30;google_apis;x86_64' > deliverables/emulator-sdk.log 2>&1
          echo no | avdmanager create avd -n codec_test -k 'system-images;android-30;google_apis;x86_64' --force
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd codec_test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > deliverables/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
      - name: Verify install and actual local H264 playback in all decoder modes
        run: |
          adb install -r deliverables/hongguotv-0.14.9-huawei-compat.apk
          adb install -r kotlin-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 180 adb shell am instrument -w com.hongguotv.nativeapp.huawei.test/com.hongguotv.nativeapp.DecoderAcceptance | tee deliverables/codec-acceptance.txt
          grep -q CODEC_ACCEPTANCE_OK deliverables/codec-acceptance.txt
          ! grep -q CODEC_ACCEPTANCE_FAILED deliverables/codec-acceptance.txt
          adb shell am start -W -n com.hongguotv.nativeapp.huawei/com.hongguotv.nativeapp.MainActivity | tee deliverables/startup.txt
          sleep 4
          adb shell pidof com.hongguotv.nativeapp.huawei >> deliverables/startup.txt
      - name: Capture Android logs
        if: always()
        run: |
          if adb get-state >/dev/null 2>&1; then adb logcat -d > deliverables/android-logcat.txt; fi
      - name: Upload APK, source, tests, and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hongguotv-huawei-compat
          retention-days: 14
          path: |
            deliverables/
            kotlin-tv/core/build/test-results/test/
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-debug.*
